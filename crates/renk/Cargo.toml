[package]
name = "renk"
version = "0.2.0"
edition = "2024"
description = "Indentation-based syntax for Rust: transpiles .rk files to .rs"
license = "AGPL-3.0-or-later"
repository = "https://github.com/scarf005/renk"
readme = "../../README.md"
keywords = ["rust", "transpiler", "syntax", "indentation"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proc-macro2 = "1"
ra_ap_parser = "=0.0.349"
ra_ap_syntax = "=0.0.349"
rowan = "0.17"
unicode-ident = "1.0.22"
wasm-bindgen = "=0.2.102"

[features]
default = ["cli", "lsp", "web"]
# The `project` and `script` modules, which read Cargo manifests and script frontmatter.
project-files = ["dep:similar", "dep:toml_edit"]
cli = ["project-files", "dep:annotate-snippets", "dep:clap", "dep:libc", "dep:serde_json"]
lsp = ["project-files", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tower-lsp"]
web = ["dep:axum", "dep:libc", "dep:serde_json", "dep:tokio"]

[[bin]]
name = "renk"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "renk-lsp"
path = "src/bin/renk-lsp.rs"
required-features = ["lsp"]

[[bin]]
name = "renk-web"
path = "src/bin/renk-web/main.rs"
required-features = ["web"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
annotate-snippets = { version = "0.12.16", optional = true }
axum = { version = "0.8.7", default-features = false, features = ["http1", "json", "tokio"], optional = true }
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.145", optional = true }
similar = { version = "3.2.0", optional = true }
libc = { version = "0.2.177", optional = true }
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tower-lsp = { version = "0.20.0", optional = true }
toml_edit = { version = "0.25.17", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
ra-ap-rustc_lexer = "0.178.0"
tower = { version = "0.5", features = ["util"] }
