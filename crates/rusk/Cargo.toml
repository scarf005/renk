[package]
name = "rusk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proc-macro2 = "1"
ra_ap_parser = "=0.0.349"
ra_ap_syntax = "=0.0.349"
rowan = "0.17"
unicode-ident = "1.0.22"
wasm-bindgen = "=0.2.102"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
annotate-snippets = "0.12.16"
axum = { version = "0.8.7", default-features = false, features = ["http1", "json", "tokio"] }
serde = "1.0.228"
serde_json = "1.0.145"
similar = "3.2.0"
libc = "0.2.177"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-lsp = "0.20.0"
toml_edit = "0.25.17"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
ra-ap-rustc_lexer = "0.178.0"
tower = { version = "0.5", features = ["util"] }
