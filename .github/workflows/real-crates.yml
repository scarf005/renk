name: real-crates

on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:

permissions: { contents: read }

concurrency: { group: real-crates, cancel-in-progress: true }

env: { CARGO_TERM_COLOR: always }

jobs:
  real-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
      # The test compares the MIR that nightly emits. Keep NIGHTLY in tests/real_crates.rs equal to it.
      - run: rustup toolchain install stable nightly-2026-04-10 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p renk --test real_crates -- --ignored
